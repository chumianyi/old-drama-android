name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate project structure
        run: |
          rm -rf android
          flutter create --org com.example --project-name old_drama --platforms=android .
          # Set app label
          sed -i 's/android:label="old_drama"/android:label="老短剧"/' android/app/src/main/AndroidManifest.xml
          # Allow cleartext for HTTP (video URLs are https, but just in case)
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: old-drama-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
